# Relay for iPhone. Generate the Xcode project with: xcodegen (run in this folder).
name: RelayMobile
options:
  bundleIdPrefix: org.openrelay
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Relay:
    type: application
    platform: iOS
    sources:
      - path: Relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openrelay.relay.mobile
        PRODUCT_NAME: Relay
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Relay
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: Relay connects to your Mac over Wi-Fi to show and drive your cards.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
    info:
      path: Relay/Info.plist
      properties:
        NSBonjourServices: [_relay._tcp]
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleURLTypes:
          - CFBundleURLName: org.openrelay.relay.mobile
            CFBundleURLSchemes: [relay]
